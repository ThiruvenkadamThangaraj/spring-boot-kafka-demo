spring:
  application:
    name: evidence-service
  
  # Database Configuration
  datasource:
    url: jdbc:h2:mem:evidencedb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8083

# Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
