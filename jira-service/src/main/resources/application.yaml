spring:
  application:
    name: jira-service
  
  # Database Configuration
  datasource:
    url: jdbc:h2:file:./data/jiradb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # Kafka Configuration (Optimized for High Throughput)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      batch-size: 32768
      linger-ms: 10
      compression-type: snappy
      acks: 1
      buffer-memory: 67108864
    consumer:
      group-id: email-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      max-poll-records: 500
      fetch-min-size: 1048576
      fetch-max-wait: 500
      properties:
        spring.json.trusted.packages: "*"
    listener:
      concurrency: 3

server:
  port: 8085

# Jira API Configuration (customize these)
jira:
  base-url: https://your-jira-instance.atlassian.net
  api-token: ${JIRA_API_TOKEN:your-api-token}
  username: ${JIRA_USERNAME:your-email@example.com}

# Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
