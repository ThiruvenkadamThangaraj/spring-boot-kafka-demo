spring.application.name=demo

# Kafka settings (adjust bootstrap servers as needed)
kafka.bootstrap-servers=localhost:9092
kafka.topic=demo-topic
kafka.group=demo-group

# Consumer: disable auto commit so we can commit after successful processing
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest

# Dead-letter topic and consumer retry settings
kafka.dlq-topic=demo-topic-dlq
kafka.consumer.max-retries=3
kafka.consumer.retry-backoff-ms=1000