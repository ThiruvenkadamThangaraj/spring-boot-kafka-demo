# Transfer Data Sources Configuration
# Add these to your existing application.properties

# ============================================
# ITM DataSource (Source Database)
# ============================================
spring.datasource.itm.jdbc-url=jdbc:sqlserver://your-itm-server:1433;databaseName=ITM;encrypt=true;trustServerCertificate=true
spring.datasource.itm.username=${DB_USERNAME:sa}
spring.datasource.itm.password=${DB_PASSWORD:YourPassword}
spring.datasource.itm.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.itm.hikari.maximum-pool-size=20
spring.datasource.itm.hikari.minimum-idle=5
spring.datasource.itm.hikari.connection-timeout=30000

# ============================================
# CO DataSource (Target Database)
# ============================================
spring.datasource.co.jdbc-url=jdbc:sqlserver://your-co-server:1433;databaseName=CO;encrypt=true;trustServerCertificate=true
spring.datasource.co.username=${DB_USERNAME:sa}
spring.datasource.co.password=${DB_PASSWORD:YourPassword}
spring.datasource.co.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.co.hikari.maximum-pool-size=20
spring.datasource.co.hikari.minimum-idle=5
spring.datasource.co.hikari.connection-timeout=30000

# ============================================
# Coordination DataSource (Partition Tracking)
# ============================================
spring.datasource.coord.jdbc-url=jdbc:sqlserver://your-coord-server:1433;databaseName=Coordination;encrypt=true;trustServerCertificate=true
spring.datasource.coord.username=${DB_USERNAME:sa}
spring.datasource.coord.password=${DB_PASSWORD:YourPassword}
spring.datasource.coord.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.coord.hikari.maximum-pool-size=10
spring.datasource.coord.hikari.minimum-idle=3
spring.datasource.coord.hikari.connection-timeout=30000

# ============================================
# Logging Configuration
# ============================================
logging.level.com.example.transfer=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/transfer-app.log
logging.file.max-size=100MB
logging.file.max-history=30
